<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONLINE ARENA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    #title {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 2px 5px #000;
      pointer-events: none;
    }

    #info {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      color: white;
      text-align: right;
      text-shadow: 0 2px 5px #000;
      line-height: 1.6;
      pointer-events: none;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 4px black;
      pointer-events: none;
    }

    #startMessage {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      z-index: 20;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      padding: 12px 20px;
      border-radius: 8px;
      pointer-events: none;
    }
  </style>

</head>

<body>

  <div id="title">ONLINE ARENA</div>

  <div id="info">
    PLAYER: 1<br>
    PLAYERS: 1 / 8<br>
    WAITING
  </div>

  <div id="crosshair">+</div>

  <div id="startMessage">
    画面をクリックしてゲーム開始
  </div>

  <div id="game"></div>

  <script type="module">

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    // ========================================
    // 基本設定
    // ========================================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87ceeb);

    scene.fog = new THREE.Fog(
      0x87ceeb,
      25,
      80
    );

    // ========================================
    // カメラ
    // ========================================

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(
      0,
      1.7,
      8
    );

    // ========================================
    // レンダラー
    // ========================================

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.shadowMap.enabled = true;

    document
      .getElementById("game")
      .appendChild(renderer.domElement);

    // ========================================
    // ライト
    // ========================================

    const ambientLight =
      new THREE.AmbientLight(
        0xffffff,
        0.6
      );

    scene.add(ambientLight);

    const sun =
      new THREE.DirectionalLight(
        0xffffff,
        1.2
      );

    sun.position.set(
      10,
      25,
      10
    );

    sun.castShadow = true;

    scene.add(sun);

    // ========================================
    // 地面
    // ========================================

    const groundGeometry =
      new THREE.BoxGeometry(
        30,
        0.5,
        30
      );

    const groundMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x444444
      });

    const ground =
      new THREE.Mesh(
        groundGeometry,
        groundMaterial
      );

    ground.position.y = -0.25;
    ground.receiveShadow = true;

    scene.add(ground);

    // ========================================
    // 壁
    // ========================================

    const wallMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x666666
      });

    const walls = [];

    function createWall(
      x,
      y,
      z,
      width,
      height,
      depth
    ) {

      const geometry =
        new THREE.BoxGeometry(
          width,
          height,
          depth
        );

      const wall =
        new THREE.Mesh(
          geometry,
          wallMaterial
        );

      wall.position.set(
        x,
        y,
        z
      );

      wall.castShadow = true;
      wall.receiveShadow = true;

      scene.add(wall);

      walls.push(wall);
    }

    createWall(
      0, 2, -15,
      30, 4, 0.5
    );

    createWall(
      0, 2, 15,
      30, 4, 0.5
    );

    createWall(
      -15, 2, 0,
      0.5, 4, 30
    );

    createWall(
      15, 2, 0,
      0.5, 4, 30
    );

    // ========================================
    // 障害物
    // ========================================

    const obstacles = [];

    function createObstacle(
      x,
      z,
      width,
      height,
      depth
    ) {

      const geometry =
        new THREE.BoxGeometry(
          width,
          height,
          depth
        );

      const material =
        new THREE.MeshStandardMaterial({
          color: 0x888888
        });

      const obstacle =
        new THREE.Mesh(
          geometry,
          material
        );

      obstacle.position.set(
        x,
        height / 2,
        z
      );

      obstacle.castShadow = true;
      obstacle.receiveShadow = true;

      scene.add(obstacle);

      obstacles.push(obstacle);
    }

    createObstacle(
      -6, -5,
      4, 2, 2
    );

    createObstacle(
      6, -5,
      4, 2, 2
    );

    createObstacle(
      -6, 5,
      4, 3, 2
    );

    createObstacle(
      6, 5,
      4, 3, 2
    );

    createObstacle(
      0, 0,
      3, 2, 3
    );

    // ========================================
    // プレイヤー
    // ========================================

    const player = {
      position: new THREE.Vector3(
        0,
        1.7,
        8
      ),

      velocity: new THREE.Vector3(),

      speed: 7,

      yaw: 0,

      pitch: 0
    };

    // ========================================
    // キーボード入力
    // ========================================

    const keys = {};

    window.addEventListener(
      "keydown",
      (event) => {

        keys[event.code] = true;

      }
    );

    window.addEventListener(
      "keyup",
      (event) => {

        keys[event.code] = false;

      }
    );

    // ========================================
    // マウス操作
    // ========================================

    let pointerLocked = false;

    renderer.domElement.addEventListener(
      "click",
      () => {

        renderer.domElement.requestPointerLock();

      }
    );

    document.addEventListener(
      "pointerlockchange",
      () => {

        pointerLocked =
          document.pointerLockElement ===
          renderer.domElement;

        document.getElementById(
          "startMessage"
        ).style.display =
          pointerLocked
            ? "none"
            : "block";

      }
    );

    document.addEventListener(
      "mousemove",
      (event) => {

        if (!pointerLocked) {
          return;
        }

        const sensitivity = 0.002;

        player.yaw -=
          event.movementX *
          sensitivity;

        player.pitch -=
          event.movementY *
          sensitivity;

        const limit =
          Math.PI / 2 - 0.05;

        player.pitch =
          Math.max(
            -limit,
            Math.min(
              limit,
              player.pitch
            )
          );

      }
    );

    // ========================================
    // 移動
    // ========================================

    const clock =
      new THREE.Clock();

    function updatePlayer(delta) {

      const forward = new THREE.Vector3(
        Math.sin(player.yaw),
        0,
        Math.cos(player.yaw)
      );

      const right = new THREE.Vector3(
        Math.cos(player.yaw),
        0,
        -Math.sin(player.yaw)
      );

      const direction =
        new THREE.Vector3();

      if (keys["KeyW"]) {
        direction.add(
          forward
        );
      }

      if (keys["KeyS"]) {
        direction.sub(
          forward
        );
      }

      if (keys["KeyD"]) {
        direction.add(
          right
        );
      }

      if (keys["KeyA"]) {
        direction.sub(
          right
        );
      }

      if (direction.lengthSq() > 0) {

        direction.normalize();

        player.position.addScaledVector(
          direction,
          player.speed * delta
        );

      }

      // ====================================
      // マップ外に出ないようにする
      // ====================================

      const limit = 13.5;

      player.position.x =
        Math.max(
          -limit,
          Math.min(
            limit,
            player.position.x
          )
        );

      player.position.z =
        Math.max(
          -limit,
          Math.min(
            limit,
            player.position.z
          )
        );

      // カメラ位置

      camera.position.copy(
        player.position
      );

      // 視点

      camera.rotation.order =
        "YXZ";

      camera.rotation.y =
        player.yaw;

      camera.rotation.x =
        player.pitch;

    }

    // ========================================
    // ゲームループ
    // ========================================

    function animate() {

      requestAnimationFrame(
        animate
      );

      const delta =
        Math.min(
          clock.getDelta(),
          0.05
        );

      updatePlayer(
        delta
      );

      renderer.render(
        scene,
        camera
      );

    }

    animate();

    // ========================================
    // 画面サイズ変更
    // ========================================

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
